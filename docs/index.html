    <!-- GitHub Pages Trailing Slash & SPA Redirection Helper -->
    <script>
      (function() {
        // 1. Ensure trailing slash on GitHub Pages directory URLs so relative paths './assets/...' resolve properly
        var loc = window.location;
        if (loc.hostname.indexOf('github.io') !== -1) {
          var p = loc.pathname;
          if (p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
            loc.replace(p + '/' + loc.search + loc.hash);
            return;
          }
        }
        // 2. Handle SPA redirect from 404.html (rafgraph standard for GitHub Pages)
        if (sessionStorage.getItem('spa_redirect')) {
          var redirect = sessionStorage.getItem('spa_redirect');
          sessionStorage.removeItem('spa_redirect');
          if (redirect && redirect !== loc.href) {
            history.replaceState(null, null, redirect);
          }
        }
      })();
    </script>
